name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "android/**"
      - "capacitor.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses & ensure platform
        run: |
          SDKROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      # ---------------------------------------------------------------
      # 1) BUNDLED APK  (models inside the app; large, fully offline)
      # ---------------------------------------------------------------
      - name: Build web — bundled models
        env:
          NEXT_PUBLIC_WHISPER_MODEL: https://localhost/models/whisper-large-v3-turbo
          NEXT_PUBLIC_WHISPER_DTYPE: q4f16
          NEXT_PUBLIC_LLM_MODEL: https://localhost/models/Qwen2.5-0.5B-Instruct
          NEXT_PUBLIC_LLM_DTYPE: q8
          NEXT_PUBLIC_TRANSFORMER_DEVICE: wasm
          NEXT_PUBLIC_WASM_PATH: https://localhost/onnx-wasm/
          NEXT_PUBLIC_API_BASE: https://echo-notes-ap43.onrender.com
        run: npm run build

      - name: Download models into the bundle
        run: |
          set -e
          HF=https://huggingface.co
          get() { curl -fSL --retry 3 --retry-delay 5 -o "$2" "$1"; }
          opt() { curl -fSL --retry 3 --retry-delay 5 -o "$2" "$1" || echo "  (optional missing: $1)"; }

          W=out/models/whisper-large-v3-turbo
          mkdir -p "$W/onnx"
          R=$HF/onnx-community/whisper-large-v3-turbo/resolve/main
          get "$R/config.json" "$W/config.json"
          get "$R/generation_config.json" "$W/generation_config.json"
          get "$R/preprocessor_config.json" "$W/preprocessor_config.json"
          get "$R/tokenizer.json" "$W/tokenizer.json"
          get "$R/tokenizer_config.json" "$W/tokenizer_config.json"
          opt "$R/special_tokens_map.json" "$W/special_tokens_map.json"
          opt "$R/added_tokens.json" "$W/added_tokens.json"
          get "$R/onnx/encoder_model_q4f16.onnx" "$W/onnx/encoder_model_q4f16.onnx"
          get "$R/onnx/decoder_model_merged_q4f16.onnx" "$W/onnx/decoder_model_merged_q4f16.onnx"

          Q=out/models/Qwen2.5-0.5B-Instruct
          mkdir -p "$Q/onnx"
          RQ=$HF/onnx-community/Qwen2.5-0.5B-Instruct/resolve/main
          get "$RQ/config.json" "$Q/config.json"
          get "$RQ/generation_config.json" "$Q/generation_config.json"
          get "$RQ/tokenizer.json" "$Q/tokenizer.json"
          get "$RQ/tokenizer_config.json" "$Q/tokenizer_config.json"
          opt "$RQ/vocab.json" "$Q/vocab.json"
          opt "$RQ/merges.txt" "$Q/merges.txt"
          opt "$RQ/special_tokens_map.json" "$Q/special_tokens_map.json"
          get "$RQ/onnx/model_quantized.onnx" "$Q/onnx/model_quantized.onnx"

      - name: Bundle ONNX Runtime WASM files
        run: |
          mkdir -p out/onnx-wasm
          cp node_modules/onnxruntime-web/dist/ort-wasm-* out/onnx-wasm/ 2>/dev/null || true

      - name: Assemble bundled APK
        run: |
          mkdir -p dist-apk
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/echo-notes-bundled.apk
          ls -lh dist-apk

      # ---------------------------------------------------------------
      # 2) LITE APK  (small, ~15 MB; downloads models on first run)
      # ---------------------------------------------------------------
      - name: Build web — lite (no bundled models)
        env:
          NEXT_PUBLIC_API_BASE: https://echo-notes-ap43.onrender.com
        run: |
          rm -rf out
          npm run build

      - name: Assemble lite APK
        run: |
          rm -rf android/app/src/main/assets/public android/app/build
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/echo-notes-lite.apk
          ls -lh dist-apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: echo-notes-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
